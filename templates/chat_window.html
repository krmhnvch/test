<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Онлайн Чат</title><style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}html,body{height:100%;background:#0b0f19;color:#f8fafc;overflow:hidden}.wrap{height:100vh;display:flex;flex-direction:column;position:relative}.head,.input{padding:12px;background:#121826;border-bottom:1px solid #ffffff18;display:flex;align-items:center;justify-content:space-between;gap:8px}.input{border:0;border-top:1px solid #ffffff18}.body{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}.msg{max-width:85%;padding:9px 12px;background:#1e293b;border-radius:12px;overflow-wrap:anywhere}.msg.admin{background:#5145a455;border:1px solid #818cf866}.meta{font-size:11px;color:#a5b4fc;margin-bottom:4px}.msg img{max-width:100%;display:block;border-radius:6px;margin-top:6px}.sys{align-self:center;color:#94a3b8;font-size:10px}.input input[type=text],.auth input{flex:1;min-width:0;background:#111827;border:1px solid #ffffff18;border-radius:9px;padding:10px;color:white;outline:none}.btn{background:#6366f1;color:white;border:0;border-radius:8px;padding:9px 12px;cursor:pointer}.btn.sec{background:#ffffff18}.btn.red{background:#ef444422;color:#f87171}.auth{position:absolute;inset:0;background:#0b0f19f7;z-index:5;display:flex;align-items:center;justify-content:center;padding:20px}.authbox{width:100%;max-width:280px;display:flex;flex-direction:column;gap:10px;text-align:center}.authrow{display:flex;gap:6px}.authrow button{flex:1}.error{color:#f87171;font-size:11px}
</style></head><body><div class="wrap">
<div class="auth" id="popup-auth-modal" style="display:none"><div class="authbox"><b>Вход в чат</b><input id="p-username" placeholder="Логин (ник)"><input id="p-password" type="password" placeholder="Пароль"><div class="error" id="p-error"></div><div class="authrow"><button class="btn" onclick="submitPopupAuth('login')">Войти</button><button class="btn sec" onclick="submitPopupAuth('register')">Регистрация</button></div></div></div>
<header class="head"><div>🟢 Чат <span id="p-user-label" style="color:#818cf8"></span></div><button class="btn red" id="p-quit-btn" onclick="logoutPopupChat()">Выйти</button></header><div class="body" id="messages-box"></div>
<form class="input" id="chat-form"><input type="file" id="file-uploader" accept="image/*" hidden><button type="button" class="btn sec" onclick="document.getElementById('file-uploader').click()">📷</button><input type="text" id="msg-input" placeholder="Сообщение..." autocomplete="off"><button type="submit" class="btn">➤</button></form></div>
<script>
let ws=null,attachedImg="";const box=document.getElementById("messages-box"),input=document.getElementById("msg-input"),modal=document.getElementById("popup-auth-modal"),uLabel=document.getElementById("p-user-label");
function checkAuth(){const token=localStorage.getItem("chat_token"),user=localStorage.getItem("chat_username");if(!token||!user){modal.style.display="flex";uLabel.textContent="";if(ws)ws.close()}else{modal.style.display="none";uLabel.textContent=`(${user})`;connectWS(token)}}
async function submitPopupAuth(mode){const u=document.getElementById("p-username").value.trim(),p=document.getElementById("p-password").value.trim(),err=document.getElementById("p-error");err.textContent="";if(!u||!p){err.textContent="Заполните логин и пароль";return}try{const res=await fetch(`/api/chat/${mode}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u,password:p})}),d=await res.json();if(!res.ok){err.textContent=d.detail||"Ошибка";return}localStorage.setItem("chat_token",d.token);localStorage.setItem("chat_username",d.username);checkAuth()}catch(e){err.textContent="Сетевая ошибка"}}
function logoutPopupChat(){localStorage.removeItem("chat_token");localStorage.removeItem("chat_username");checkAuth()}
function connectWS(token){if(ws)ws.close();const proto=location.protocol==="https:"?"wss:":"ws:";ws=new WebSocket(`${proto}//${location.host}/ws/chat`);ws.onopen=()=>ws.send(JSON.stringify({token,admin_key:""}));ws.onmessage=e=>{const d=JSON.parse(e.data);if(d.type==="error")logoutPopupChat();else if(d.type==="history"){box.innerHTML="";d.messages.forEach(renderMessage);box.scrollTop=box.scrollHeight}else if(d.type==="chat_message"){renderMessage(d);box.scrollTop=box.scrollHeight}else if(d.type==="system"){const s=document.createElement("div");s.className="sys";s.textContent=d.text;box.appendChild(s);box.scrollTop=box.scrollHeight}}}
function renderMessage(msg){const el=document.createElement("div");el.className="msg"+(msg.is_admin?" admin":"");const top=document.createElement("div");top.className="meta";top.textContent=(msg.is_admin?"👑 Администратор":msg.username)+(msg.time_str?` · ${msg.time_str}`:"");el.appendChild(top);if(msg.text){const t=document.createElement("div");t.textContent=msg.text;el.appendChild(t)}if(msg.image_url){const img=document.createElement("img");img.src=msg.image_url;img.alt="Изображение";el.appendChild(img)}box.appendChild(el)}
document.getElementById("chat-form").onsubmit=e=>{e.preventDefault();const val=input.value.trim();if(!val&&!attachedImg)return;if(ws&&ws.readyState===WebSocket.OPEN){ws.send(JSON.stringify({text:val,image_url:attachedImg}));input.value="";attachedImg=""}};
async function uploadFile(file){const fd=new FormData();fd.append("file",file);try{const r=await fetch("/upload",{method:"POST",body:fd}),d=await r.json();if(!r.ok)throw new Error(d.detail||"Ошибка");attachedImg=d.url;input.placeholder="Фото прикреплено — напишите сообщение или отправьте"}catch(e){alert("Ошибка загрузки фото: "+e.message)}}
document.getElementById("file-uploader").onchange=e=>{if(e.target.files[0])uploadFile(e.target.files[0])};window.addEventListener("paste",e=>{for(const item of (e.clipboardData||e.originalEvent.clipboardData).items){if(item.type.includes("image")){uploadFile(item.getAsFile());break}}});checkAuth();
</script></body></html>
